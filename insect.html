<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
</head>
<body>
<script>
let t = 0;

function setup() {
    createCanvas(400, 400);
    stroke(255, 96);
}

function draw() {
    background(9);
    t += PI / 240;

    for (let i = 10000; i--; ) {
        a(i, i / 235);
    }
}

function a(x, y) {
    let k = (4 + sin(y * 2 - t) * 3) * cos(x / 29);
    let e = y / 8 - 13;
    let d = mag(k, e);
    
    let q = 3 * sin(k * 2) + 0.3 / k + sin(y / 25) * k * (9 + 4 * sin(e * 9 - d * 3 + t * 2));
    let c = d - t;

    point(q + 30 * cos(c) + 200, q * sin(c) + d * 39 - 220);
}

function mag(a, b) {
    return Math.sqrt(a * a + b * b);
}
</script>
</body>
</html>
